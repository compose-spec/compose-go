name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  ci:
    # a tag must not publish anything unless the full CI is green on it
    uses: ./.github/workflows/ci.yml

  binary:
    needs:
      - ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      -
        name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go version
      -
        name: Build
        run: |
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} make build
          ls -al bin/
      -
        name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compose-spec-${{ matrix.os }}-${{ matrix.arch }}
          path: ./bin/*
          if-no-files-found: error

  release:
    permissions:
      contents: write # to create a release (ncipollo/release-action)
    runs-on: ubuntu-latest
    needs:
      - binary
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      -
        name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: bin/
          merge-multiple: true
      -
        name: Checksums
        run: cd bin && sha256sum compose-spec-* > SHA256SUMS
      -
        name: GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          artifacts: bin/*
          generateReleaseNotes: true
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}
