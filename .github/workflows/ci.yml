on:
  push:
    branches:
      - main # other branches are covered by their pull request, tags by the release workflow
  pull_request:
  workflow_call: # reused by the release workflow as a gate
name: Continuous integration

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Check license
        run: DOCKER_BUILDKIT=1 make check-license
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check deepcopy
        run: |
          make deepcopy
          if [ -n "$(git status --porcelain)" ]; then
            echo >&2 'ERROR: DeepCopy is not up to date with code. Please run "make deepcopy"'
            git status --porcelain >&2
            exit 1
          fi
      - name: Check generated sources
        run: make check-generate

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.1.6
          args: --verbose
          skip-cache: true

  api-compat:
    name: api compatibility
    # Only meaningful on pull requests; skipped when reused by the release workflow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A help for maintainers to spot a change that is invisible in the diff
    # (embedded structs, promoted fields, changed signatures): the report goes
    # to the job summary and a warning, it never fails the check.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # the tool itself requires a recent Go, whatever go.mod declares
          go-version: stable
      - name: Install gorelease
        run: go install golang.org/x/exp/cmd/gorelease@v0.0.0-20261014143641-f0251eb4aa3e
      - name: Compare the public API with the latest release
        run: |
          status=0
          gorelease > gorelease.txt 2>&1 || status=$?
          cat gorelease.txt
          {
            echo '### Public API changes since the latest release'
            echo '```'
            cat gorelease.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Public API::gorelease reports API changes (some may be incompatible), see the job summary"
          fi

  test:
    strategy:
      matrix:
        go-version: ['1.26', '1.27']
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true
        cache: true
    - name: Test
      run: go test ./...

  static-checks:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Vet
        # stdmethods is disabled on purpose: (*types.Project).MarshalJSON takes
        # marshalling options, so it does not have the json.Marshaler signature
        # the analyzer expects. It is public API used by consumers, changing it
        # would be a breaking change. encoding/json never calls it, which is
        # what the analyzer warns about. All other analyzers stay enabled.
        run: go vet -stdmethods=false ./...
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

  vulncheck:
    name: vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Informative only: findings come from an external advisory database that
    # evolves independently of the pull request, so they must not block it. The
    # report goes to the job summary and a warning.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # the tool itself requires a recent Go, whatever go.mod declares
          go-version: stable
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Look for known vulnerabilities
        run: |
          status=0
          govulncheck ./... > govulncheck.txt 2>&1 || status=$?
          cat govulncheck.txt
          {
            echo '### Known vulnerabilities (govulncheck)'
            echo '```'
            cat govulncheck.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=govulncheck::govulncheck reports vulnerabilities or failed, see the job summary"
          fi

  # Single required check for branch protection: it fails if any gating job
  # failed, was cancelled or was skipped. Adding, renaming or splitting a job
  # (or changing the Go versions of the test matrix) then needs no change to
  # the repository settings. api-compat and vulncheck are left out on purpose:
  # they are informational and never block a merge.
  ci-ok:
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - validate
      - lint
      - static-checks
      - test
    steps:
      - name: Check the result of the required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.[]; .value.result == "success")' > /dev/null
