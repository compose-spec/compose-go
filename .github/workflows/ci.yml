on:
  push:
  pull_request:
  workflow_call: # reused by the release workflow as a gate
name: Continuous integration

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Check license
        run: DOCKER_BUILDKIT=1 make check-license
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check deepcopy
        run: |
          make deepcopy
          if [ -n "$(git status --porcelain)" ]; then
            echo >&2 'ERROR: DeepCopy is not up to date with code. Please run "make deepcopy"'
            git status --porcelain >&2
            exit 1
          fi
      - name: Check generated sources
        run: make check-generate

  api-compat:
    name: api compatibility
    # Only meaningful on pull requests; skipped when reused by the release workflow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Informational for now: breaking changes are reported in the job summary
    # but do not block the merge, until the noise level is known.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install gorelease
        run: go install golang.org/x/exp/cmd/gorelease@v0.0.0-20261014143641-f0251eb4aa3e
      - name: Compare the public API with the latest release
        run: |
          status=0
          gorelease > gorelease.txt 2>&1 || status=$?
          cat gorelease.txt
          { echo '```'; cat gorelease.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  test:
    strategy:
      matrix:
        go-version: ['1.24', '1.25']
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true
        cache: true
    - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
      with:
        version: v2.1.6
        args: --verbose
        skip-cache: true
    - name: Test
      run: go test ./...
