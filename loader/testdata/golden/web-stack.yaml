name: golden
services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
      args:
        TAG: ${GOLDEN_TAG}
        UNSET_ARG: null
      labels:
        com.example.stage: build
      target: runtime
      additional_contexts:
        assets: ./assets
    image: example/web:${GOLDEN_TAG}
    command: ["serve", "--port", "${GOLDEN_PORT}"]
    entrypoint: /entrypoint.sh
    environment:
      - MODE=production
      - DEBUG
    ports:
      - "${GOLDEN_PORT}:80"
      - target: 443
        published: "8443"
        protocol: tcp
        mode: host
    expose:
      - "9090"
    depends_on:
      db:
        condition: service_healthy
        required: true
      cache:
        condition: service_started
    networks:
      frontend:
        aliases:
          - www
        priority: 10
      backend: null
    volumes:
      - ./static:/usr/share/nginx/html:ro
      - type: volume
        source: data
        target: /data
        volume:
          nocopy: true
      - type: tmpfs
        target: /scratch
        tmpfs:
          size: 10485760
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 128M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    labels:
      com.example.app: web
    logging:
      driver: json-file
      options:
        max-size: 10m
    restart: unless-stopped
    scale: 2
    profiles:
      - frontend
    post_start:
      - command: ./warm-cache.sh
        user: root
    pre_stop:
      - command: ./drain.sh

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: db_password
        target: /run/secrets/db_password
        mode: 0400
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s

  cache:
    image: redis:7
    configs:
      - source: redis_conf
        target: /etc/redis/redis.conf

networks:
  frontend: {}
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  data: {}
  db-data:
    labels:
      com.example.retain: "true"

secrets:
  db_password:
    file: ./db_password.txt

configs:
  redis_conf:
    file: ./redis.conf
